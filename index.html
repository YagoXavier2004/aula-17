<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula-17</title>
    <link rel="stylesheet" href="style/style.css">
    
    <!-- Links corrigidos da fonte Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="layout">
        
        <!-- 1. Bloco da Esquerda: Agrupa header, main e footer -->
        <div class="conteudo-esquerda">
            <header class="header-container">
                <span>⚡ <b>TEMPORADA 04 ATIVADA</b></span>
            </header>

            <main class="main-container">
                <h1>CiberStrike: Arena do Futuro</h1>
                <br>
                <p class="color-font-p">
                    Monte seu esquadrão cibernético, dispute torneios semanais e domine os servidores de alta performance com taxas de 144 FPS e premiações exclusivas.
                </p>

                <div class="container-formatos">
                    <span class="formato">🛡️ Anti-cheat</span>
                    <span class="formato">⚡ 128 Tick</span>
                    <span class="formato">🏆 Ranqueado</span>
                </div>
            </main>

            <footer class="footer-container">
                <button type="button" class="bnt-jogar">JOGUE AGORA ⚔️</button>
            </footer>
        </div>

        <!-- 2. Bloco da Direita: Imagem isolada fora do footer -->
        <img class="img-footer" src="img/manete.png" alt="Controle de videogame">

    </div>
</body>
</html>
