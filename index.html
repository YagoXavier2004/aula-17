<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--• width=device-widthDefine a largura da área visível da página para corresponder à largura física ou CSS da tela do dispositivo, 
    impedindo que os navegadores móveis assumam por padrão um layout do tamanho de um computador e forçando os usuários a usar o gesto de pinça para ampliar.
    • initial-scale=1.0Define o nível de zoom inicial para 100% (uma proporção de 1:1) quando a página é carregada pela primeira vez.
    
    Por que isso importa
    
    • Design responsivo: É um elemento fundamental para sites otimizados para dispositivos móveis, 
    garantindo que os layouts se adaptem perfeitamente a smartphones, 
    tablets e monitores de computador.
    • Impedindo o redimensionamento indesejado: Sem isso, 
    os navegadores móveis geralmente renderizam as páginas na largura de um computador (cerca de 980px ou mais) e as reduzem, 
    tornando o texto minúsculo e ilegível sem zoom manual..-->
